schema_version: 1

# Cloudini — compressed point clouds (facontidavide/cloudini). Static lib +
# committed platform-neutral config exposing `cloudini::cloudini`. The build
# uses the repo's vendored-deps path (CPM fetches lz4/zstd sources at configure
# time) and links them PRIVATE; the config re-adds the env's lz4/zstd for
# consumers, matching the Conan package's dependency graph.

context:
  version: "1.2.3"

package:
  name: cloudini
  version: ${{ version }}

source:
  url: https://github.com/facontidavide/cloudini/archive/refs/tags/${{ version }}.tar.gz
  sha256: 414e55a63eae2ffa169da16e24c69723c96d4d9d13cc020c175763f14c029209

build:
  number: 0
  script:
    # Unix: build against the conda cross-compiler ($CC/$CXX) — default sysroot
    # is the conda glibc (2.28); the system GCC would leave __isoc23_* refs.
    - if: unix
      then:
        - cmake -G Ninja -B build -S cloudini_lib -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=Release -DCLOUDINI_BUILD_TOOLS=OFF -DCLOUDINI_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        - cmake --build build --target cloudini_lib
        - mkdir -p "$PREFIX/lib/cmake/cloudini" "$PREFIX/include"
        - cp build/libcloudini_lib.a "$PREFIX/lib/"
        - cp -r cloudini_lib/include/cloudini_lib "$PREFIX/include/"
        - cp "$RECIPE_DIR/cloudini-config.cmake" "$PREFIX/lib/cmake/cloudini/cloudini-config.cmake"
    - if: win
      then:
        - cmake -G Ninja -B build -S cloudini_lib -DCMAKE_BUILD_TYPE=Release -DCLOUDINI_BUILD_TOOLS=OFF -DCLOUDINI_BUILD_BENCHMARKS=OFF -DBUILD_TESTING=OFF
        - cmake --build build --config Release --target cloudini_lib
        - if not exist "%LIBRARY_PREFIX%\lib\cmake\cloudini" mkdir "%LIBRARY_PREFIX%\lib\cmake\cloudini"
        - copy /Y build\cloudini_lib.lib "%LIBRARY_PREFIX%\lib\"
        - xcopy /E /I /Y cloudini_lib\include\cloudini_lib "%LIBRARY_PREFIX%\include\cloudini_lib"
        - copy /Y "%RECIPE_DIR%\cloudini-config.cmake" "%LIBRARY_PREFIX%\lib\cmake\cloudini\cloudini-config.cmake"

requirements:
  build:
    - ${{ compiler('cxx') }}
    # Linux only: pins the target glibc sysroot (see recipes/variants.yaml).
    - if: linux
      then:
        - ${{ stdlib('c') }}
    - cmake
    - ninja
    - git
  run:
    - lz4-c
    - zstd

about:
  homepage: https://github.com/facontidavide/cloudini
  license: Apache-2.0
  summary: Cloudini — fast point cloud compression library
