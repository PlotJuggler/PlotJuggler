# SPDX-License-Identifier: MPL-2.0
#
# Build the plotjuggler4 conda package (packaging/conda) and, on a release tag,
# publish it with PJ4's own dependency packages (recipes/) to the prefix.dev
# "plotjuggler" channel, where RoboStack users install it from.
#
#   - push of a version tag -> build + upload
#   - workflow_dispatch      -> build only, packages kept as a run artifact
#   - pull_request           -> build only, when the recipes change
#
# Upload needs the repo secret PREFIX_API_KEY: a prefix.dev token with write
# access to the "plotjuggler" channel. `--skip-existing` makes a re-run upload
# nothing that is already published; a version is published once.
name: Conda release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - packaging/conda/**
      - recipes/**
      - .github/workflows/conda-release.yml

permissions:
  contents: read

concurrency:
  group: conda-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: conda (${{ matrix.subdir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { subdir: linux-64, os: ubuntu-22.04 }
          - { subdir: osx-arm64, os: macos-15 }
    timeout-minutes: 120
    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          run-install: false
          cache: false

      - name: Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      # recipes/ffmpeg is the LGPL-lean build the pixi dev env links; the
      # package uses conda-forge's LGPL ffmpeg instead (see packaging/conda).
      - name: Build PJ4's dependency packages
        run: |
          pixi exec --spec "rattler-build>=0.66,<0.67" rattler-build build \
            --recipe recipes/luau --recipe recipes/libmcap --recipe recipes/cloudini \
            --recipe recipes/kissfft --recipe recipes/libnanoarrow \
            -m recipes/variants.yaml -c conda-forge --output-dir local-channel

      - name: Build plotjuggler4
        run: packaging/conda/build_conda.sh --channel ./local-channel --output-dir conda-output

      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-${{ matrix.subdir }}
          path: |
            local-channel/${{ matrix.subdir }}/*.conda
            conda-output/${{ matrix.subdir }}/*.conda
          if-no-files-found: error

      - name: Upload to prefix.dev (plotjuggler)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          find local-channel/${{ matrix.subdir }} conda-output/${{ matrix.subdir }} -name '*.conda' -print0 \
            | xargs -0 pixi exec --spec "rattler-build>=0.66,<0.67" \
                rattler-build upload prefix --channel plotjuggler --skip-existing
