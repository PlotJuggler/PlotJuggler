name: Linux CI

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt trusted runs while they are publishing newly built Conan
  # packages. Superseded pull-request runs remain safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: read

  build:
    if: github.event.pull_request.draft == false
    runs-on: depot-ubuntu-22.04-4
    # Backstop against hangs (a deadlocked test otherwise holds the runner for
    # GitHub's 6-hour default). Worst observed legitimate run — cold Conan +
    # cold ccache — is ~28 min.
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - uses: conan-io/setup-conan@v1
        with:
          # Binaries come from the Depot-backed Actions cache below, with
          # ConanCenter source builds as the fallback. Do not also archive
          # ~/.conan2 through setup-conan itself.
          cache_packages: false

      - name: Compute Conan cache hash
        id: conan_cache
        shell: bash
        run: |
          set -euo pipefail
          # Hash every conanfile.txt under the tree (today the top-level
          # one; future submodules under PJ4 may add their own) so the
          # key invalidates when any of them changes.
          hash=$(find . \( -name conanfile.txt -o -name conan.lock \) -not -path './build/*' -not -path './.git/*' \
                  -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Conan cache
        # On Depot runners actions/cache is backed by Depot Cache storage —
        # the authoritative Conan binary store; ConanCenter source builds are
        # the fallback.
        id: conan-gha-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          # v2 prefix (July 2026): bumped to invalidate caches carrying the
          # pre-#30610 assimp/5.4.3 recipe revision (which still pins draco/1.5.6
          # and clashes with our new draco/1.5.7 pin). Fold this suffix out once
          # everyone has moved past the transition.
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}
          # Partial reuse when conanfile.txt changes: an older closure for the
          # same OS/compiler still seeds most packages, so only the changed dep
          # (and its dependents) rebuild rather than the whole graph.
          restore-keys: |
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Seed Conan source download cache
        # minizip/1.2.13 has a single zlib.net source URL that rejects GitHub
        # runners with HTTP 415. Use the same checksum-verified, repo-hosted
        # Conan download-cache seed as the proven Windows workflows. This is
        # deliberately configured after restoring ~/.conan2 so a restored
        # global.conf cannot clobber it.
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;

          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -v '^core\.sources:download_cache=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"
          cat "$conf"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-${{ steps.versions.outputs.qt_version }}-linux-gcc_64

      - name: Install Qt via aqt
        # Delegates to scripts/install_qt6.sh, which reads versions.env.
        # It installs into ./.qt and no-ops if present.
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./scripts/install_qt6.sh

      - name: Install Qt 6 + FFmpeg VAAPI system dependencies
        run: |
          sudo apt-get update
          # libva-dev / libdrm-dev are required by the FFmpeg Conan build:
          # with_vaapi=True pulls vaapi/system, whose package_info resolves libva
          # and libva-drm via pkg-config — they must exist on the build host.
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libva-dev libdrm-dev \
            xvfb ccache zstd

      - name: Configure ccache
        # Compiler-output cache for our own C++ — complementary to the Conan
        # cache (which holds prebuilt third-party packages, not our objects).
        # Keep the regular-build namespace disjoint from TSan. The former
        # `ccache-linux-` catch-all selected the newer ccache-linux-tsan-* entry
        # and produced 0/810 hits because sanitizer objects are incompatible.
        # On Depot runners actions/cache is backed by Depot Cache storage (not
        # GitHub's shared 10 GB quota), so PR runs save as well as restore —
        # repeat pushes to a PR recompile only their own edits.
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-build-${{ github.ref_name }}-${{ github.sha }}
          # The final two are safe migration paths: both identify regular
          # builds explicitly by ref and cannot match ccache-linux-tsan-*.
          restore-keys: |
            ccache-linux-build-${{ github.ref_name }}-
            ccache-linux-build-main-
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-main-

      - name: Set ccache limits
        # 2G, not 500M: the full compiled object set (esp. after the Qt
        # bump, whose larger headers grew per-TU output) exceeds 500M, so a
        # 500M cap thrashed — ccache evicted this build's own early objects
        # mid-run (observed: 25 cleanups, 39% hit rate), leaving every later
        # build permanently partially-cold. 2G holds the whole warm set.
        # compiler_check=content / hash_dir=false / base_dir: hash objects
        # independently of the compiler mtime and the workspace root so the
        # linux-appimage-release container job (same gcc 11.4, different
        # workspace path) can reuse this cache via its restore-keys.
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache -z

      - name: Conan install
        # Match the proven Windows sequencing: resolve/build the dependency
        # graph, publish it immediately, then compile PlotJuggler. A later app
        # compile failure must not discard an otherwise reusable Conan closure.
        id: conan_install
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect --force
          scripts/configure_conan_remote.sh
          conan_log="${RUNNER_TEMP}/pj4-conan-install.log"
          conan install . --output-folder=build --build=missing -r=plotjuggler-conan -r=conancenter \
            --lockfile=conan.lock --lockfile-partial \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            2>&1 | tee "$conan_log"
          if grep -q "Building from source" "$conan_log"; then
            echo "::notice::Conan built missing Linux binaries; the cache saves below persist them."
          fi

      - name: Build
        # Conan already generated build/conan_toolchain.cmake above; do not
        # resolve the graph twice. Tests compile here too: with warm compiler
        # caches they cost ~1 min, and this job is the only CI environment
        # that can run the GUI/GL widget suites (xvfb + Mesa llvmpipe).
        run: ./build.sh --skip-conan-install

      - name: Trim Conan cache before saving
        # Drop build/source/temp trees so only the package binaries consumers
        # need are persisted. Runs only when we're about to save a fresh entry.
        if: always() && steps.conan-gha-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache
        # Persist the built closure under the exact conanfile hash so the next
        # run on any identically-keyed branch restores it. `always()` so a
        # failing project compile still saves the third-party deps that
        # finished earlier — they're the expensive part. Keys are immutable,
        # so skip only on an exact-key hit.
        if: always() && steps.conan-gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}

      - name: Save ccache
        # always(): a failed build's objects are still valid.
        #
        # push-to-main only. The key carries the SHA (cache keys are immutable),
        # so every run that saves writes a *new* ~2 GB blob that nothing ever
        # deletes — and Depot Cache is billed per GB-month, unlike GitHub's
        # free-but-LRU-evicted 10 GB quota. Saving from PR runs at this repo's
        # velocity wrote ~40 GB/day of never-reclaimed storage. PR runs still
        # RESTORE (via the main-branch restore-keys below), and hash_dir=false
        # + base_dir make a main-based restore hit across workspace paths, so
        # the cost is a few minutes on repeat pushes to the same PR.
        if: always() && github.event_name == 'push' && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-build-${{ github.ref_name }}-${{ github.sha }}

      - name: ccache stats
        if: success()
        run: ccache -s

      - name: Test
        # --timeout kills any single test after 2 min (the suite normally
        # finishes in well under that), so one deadlocked test fails loudly
        # with its name in the log instead of stalling the whole job.
        run: xvfb-run -a ctest --test-dir build --output-on-failure --timeout 120

  tsan:
    # ThreadSanitizer guard for the datastore worker-thread races (e.g. the
    # streaming pause/resume WriteCore swap). Builds + runs ONLY the Qt-free
    # foundation concurrency tests under -fsanitize=thread — no GUI, no xvfb. Runs
    # in parallel with `build`, sharing its cached Qt + RelWithDebInfo Conan
    # closure (only our own sources get instrumented). See ./build.sh --tsan.
    if: github.event.pull_request.draft == false
    runs-on: depot-ubuntu-22.04-4
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"
          echo "app_version=${PJ_APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "qt_version=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "appimage_arch=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_OUTPUT}"

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Compute Conan cache hash
        id: conan_cache
        shell: bash
        run: |
          set -euo pipefail
          # Same hash as the `build` job so we restore its prebuilt closure.
          hash=$(find . \( -name conanfile.txt -o -name conan.lock \) -not -path './build/*' -not -path './.git/*' \
                  -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Conan cache from GitHub Actions cache
        # Shares the build job's RelWithDebInfo key — TSan reuses the same prebuilt
        # dependency binaries (instrumentation is applied only to our sources).
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: conan-linux-gcc-relwithdebinfo-v2-${{ steps.conan_cache.outputs.hash }}
          restore-keys: |
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Seed Conan source download cache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;

          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -v '^core\.sources:download_cache=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"
          cat "$conf"

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-${{ steps.versions.outputs.qt_version }}-linux-gcc_64

      - name: Install Qt via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./scripts/install_qt6.sh

      - name: Install Qt 6 + FFmpeg VAAPI system dependencies
        # Same set as the `build` job: configure still runs find_package(Qt6) for
        # the modules it won't build, and `conan install` resolves the full graph
        # (FFmpeg's vaapi/system needs libva-dev / libdrm-dev at generate time).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libva-dev libdrm-dev \
            ccache

      - name: Lower ASLR entropy for sanitizers
        # Modern kernels default vm.mmap_rnd_bits high enough that the TSan runtime
        # aborts at startup with "unexpected memory mapping". 28 is the value the
        # sanitizer runtimes expect; harmless otherwise.
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Configure ccache
        # restore/save split rather than actions/cache: the implicit post-job
        # save fires on every run, and a SHA-keyed entry is never an exact hit,
        # so each run persisted a new ~1 GB blob into billed Depot Cache
        # storage. See the build job's "Save ccache" for the full rationale.
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-tsan-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-tsan-${{ github.ref_name }}-
            ccache-linux-tsan-

      - name: Set ccache limits
        run: |
          ccache --set-config=max_size=1G
          ccache --set-config=compression=true
          ccache -z

      - name: Build + run foundation tests under ThreadSanitizer
        run: ./build.sh --tsan

      - name: Save ccache
        if: always() && github.event_name == 'push' && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-linux-tsan-${{ github.ref_name }}-${{ github.sha }}

      - name: ccache stats
        if: success()
        run: ccache -s
