name: Cache cleanup

# Keeps the repo's shared ~10 GB GitHub-hosted Actions cache budget healthy.
# That budget is pooled across ALL workflows and branches and is LRU-evicted (by
# last-accessed) once full, so stale duplicates can evict a cache some job still
# needs warm.
#
# SCOPE — read before trusting this workflow with a storage bill:
# it reclaims *GitHub's* cache store only, because the management API it drives
# (/repos/{owner}/{repo}/actions/caches) is served by GitHub. Jobs on `depot-*`
# runners have their actions/cache save+restore transparently redirected to
# Depot Cache, whose entries are NOT visible to that API and are NOT deleted
# here. Since almost every heavy job in this repo runs on Depot, the store this
# workflow manages holds only the few GitHub-hosted jobs' caches (pre-commit and
# the release smoke jobs) — tens of MB.
#
# Depot Cache is billed per GB-month and is governed by the retention policy in
# the Depot organisation settings, plus the save gating in the workflows
# themselves (compiler caches are written from push-to-main runs only; see
# linux-ci.yml's "Save ccache"). Neither of those levers lives here.
#
# Two reclaim paths, neither of which touches the build pipelines:
#   * pr-cache-cleanup  — when a PR closes, delete the caches scoped to its ref.
#   * prune-stale-caches — remove late cache writes from already-closed PR refs,
#     then keep only the newest cache per (ref, key-family) and drop the per-SHA
#     rolling churn, because restore-keys always restores the most recent.

on:
  pull_request:
    types: [closed]
  push:
    # Prune right after every merge: the rolling per-SHA families otherwise
    # hold 2-3 near-identical generations (~1-2 GB) between cron ticks.
    branches: [main]
  schedule:
    # Daily. The GitHub-hosted store this prunes (see the scope note above) sees
    # only a handful of small writes per day, so a tighter tick reclaims nothing.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write     # delete cache entries via the REST API
  contents: read
  pull-requests: read  # distinguish live PR cache refs from late closed-PR writes

concurrency:
  # Serialize prunes so two runs don't race on the same cache IDs.
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  pr-cache-cleanup:
    # Same-repo PRs only: fork PRs run with a read-only GITHUB_TOKEN that cannot
    # delete caches, and their caches are isolated to the fork's ref anyway.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for the closed PR's ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          echo "Deleting caches scoped to ${PR_REF}"
          # The native sccache backend stores one cache entry per compiled
          # object, so a single PR can own well over the list endpoint's
          # 100-entry page size. Follow every Link header before deleting.
          ids=$(gh api --paginate \
                  "/repos/${REPO}/actions/caches?ref=${PR_REF}&per_page=100" \
                  --jq '.actions_caches[].id')
          if [ -z "${ids}" ]; then
            echo "No caches found for ${PR_REF}"
            exit 0
          fi
          for id in ${ids}; do
            echo "  deleting cache id=${id}"
            # Don't fail the whole job if a single cache vanished between list
            # and delete (another cleanup run, or GitHub's own TTL eviction).
            gh api --method DELETE "/repos/${REPO}/actions/caches/${id}" \
              || echo "  (delete failed for ${id}, continuing)"
          done

  prune-stale-caches:
    # Schedule + manual only (not on PR close — that's the job above).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Prune to newest-per-family
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # --apply actually deletes; the script is a safe dry-run without it.
        run: python3 .github/scripts/prune_caches.py --apply
