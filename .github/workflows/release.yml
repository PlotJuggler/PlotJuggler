name: Release PlotJuggler

# Builds the portable Linux AppImage and Windows Portable version, and on a version tag,
# attaches them to the GitHub Release. Modeled on PlotJuggler 3's ubuntu.yaml release job, adapted to
# PJ4's heavier setup (Qt from aqt into ./.qt, deps from Conan) — so it reuses
# the same Qt/Conan/ccache caching that linux-ci.yml relies on.
#
# Triggers:
#   - push of a `v*` tag  -> build + publish the AppImage & ZIP to that tag's Release
#   - workflow_dispatch   -> build artifacts from any branch (artifact only, no
#                            Release upload) for smoke-testing the packaging
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # softprops/action-gh-release needs write to create/update the Release

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0   # tags/describe need full history

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Cache Conan packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          # Keyed on the dependency manifests; partial reuse via the prefix.
          key: conan-appimage-${{ hashFiles('**/conanfile.txt') }}
          restore-keys: conan-appimage-

      - name: Cache Qt 6.11.1
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-6.11.1-linux

      - name: Install Qt 6.11.1 via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./install_qt6.sh   # installs into ./.qt; no-ops if already present

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libva-dev / libdrm-dev: required by the FFmpeg Conan build (VAAPI).
          # imagemagick: `convert` rasterizes the app icon in build_appimage.sh.
          # wget/file: linuxdeploy fetch + ELF inspection.
          # unzip: --plugins-registry unpacks the downloaded plugin zips (python3
          #        + sha256sum for registry parse/verify are already on the runner).
          sudo apt-get install -y --no-install-recommends \
            libva-dev libdrm-dev \
            imagemagick wget file unzip ccache zstd

      - name: Configure ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
          restore-keys: ccache-appimage-

      - name: Build plotjuggler4
        run: ./build.sh

      - name: Build AppImage
        env:
          # The linuxdeploy tools are themselves AppImages; ubuntu-22.04 runners no
          # longer ship libfuse2, so run them extracted instead of FUSE-mounted.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          # --plugins-registry: download the curated official plugin set (BUNDLE_IDS)
          # from pj-plugin-registry (main), verify checksums, unpack into the bundle.
          # Fails the release if any curated plugin can't be resolved/downloaded.
          bash appimage/build_appimage.sh --plugins-registry
          # Stamp the artifact with the tag (or short sha for manual runs). The
          # script emits PlotJuggler-<version>-x86_64.AppImage into appimage/.
          ref="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          safe="${ref//\//-}"
          src="$(ls appimage/PlotJuggler-*-x86_64.AppImage)"
          dest="appimage/PlotJuggler-${safe}-x86_64.AppImage"
          [ "${src}" = "${dest}" ] || mv "${src}" "${dest}"
          echo "APPIMAGE=${dest}" >> "${GITHUB_ENV}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('PlotJuggler-{0}-x86_64.AppImage', github.ref_name) }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    steps:
      - name: Use HTTPS for github.com submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: conan-io/setup-conan@v1
        with:
          cache_packages: false

      - name: Compute Conan cache tag
        id: conan_cache
        shell: pwsh
        run: |
          $cacheVersion = "v4"
          $fileHash = (Get-FileHash conanfile.txt -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          $hash = "$cacheVersion-$fileHash"
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore Conan cache from GitHub Actions cache
        id: conan-gha-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.conan_cache.outputs.hash }}
          restore-keys: |
            conan-windows-msvc-relwithdebinfo-v4-

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          key: qt-6.11.1-windows-msvc2022_64

      - name: Install Qt 6.11.1 via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip install "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          attempt=0
          until aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --outputdir ./.qt; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 5 ]; then echo "aqt failed after ${attempt} attempts" >&2; exit 1; fi
            echo "aqt attempt ${attempt} failed (transient mirror?); retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: bash
        run: |
          QT_DIR="$(pwd)/.qt/6.11.1/msvc2022_64"
          if [[ ! -d "$QT_DIR" ]]; then
            echo "::error::Qt 6.11.1 not found at $QT_DIR"
            exit 1
          fi

          conan profile detect --force
          conan install . --output-folder=build --build=missing \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 \
            -o "cpython/*:shared=True" -s "cpython/*:build_type=Release" \
            -c tools.cmake.cmaketoolchain:generator="Ninja Multi-Config"

          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_TOOLCHAIN_FILE="build/conan_toolchain.cmake" \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

          cmake --build build --config RelWithDebInfo --parallel

      - name: Trim Conan cache before saving
        if: always() && steps.conan-gha-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: conan cache clean "*" --build --source --temp; $global:LASTEXITCODE = 0

      - name: Save Conan cache to GitHub Actions cache
        if: always() && steps.conan-gha-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-windows-msvc-relwithdebinfo-${{ steps.conan_cache.outputs.hash }}

      - name: Package Release
        shell: pwsh
        run: |
          powershell -File scripts/package_windows.ps1 -BuildDir build -QtDir .qt/6.11.1/msvc2022_64 -OutputDir dist/PlotJuggler
          ref="${{ github.ref_name }}"
          # Replace slash in git branch/tag names for filenames
          safe="${ref//\//-}"
          Compress-Archive -Path dist/PlotJuggler -DestinationPath "dist/PlotJuggler-Windows-${safe}.zip"
          echo "ZIP_PATH=dist/PlotJuggler-Windows-${safe}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlotJuggler-Windows-${{ github.ref_name }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Attach Windows Portable to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
