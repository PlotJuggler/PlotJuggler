name: Nix

# The flake is community-maintained: it is checked on demand (Actions → Nix →
# Run workflow) and on pull requests that touch it, never on every pull request.
# Drafts wait: marking one ready runs it.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - flake.nix
      - flake.lock
      - packaging/nix/**
      # dependencies.nix reads source pins and CMake adapters from the recipes.
      - recipes/**
      - .github/workflows/nix.yml

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    # A cold Nix store builds FFmpeg, Luau and the app from source.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Free up runner disk space
        # GitHub-hosted Ubuntu runners leave ~14 GB free, which the Conan
        # closure, Qt and the build tree can exceed ("No space left on
        # device"). Reclaim the preinstalled toolchains no job here uses.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Full history: Nix rejects a shallow Git checkout as a flake source.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31

      - name: Build the package and run its smoke checks
        run: nix flake check --print-build-logs

      - name: Embedded Python self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: nix run . -- --selftest-python
