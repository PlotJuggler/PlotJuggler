name: Release Linux packages

# Builds the release-quality PlotJuggler 4 Linux artifacts — an AppImage and a
# Debian/Ubuntu .deb — from one compile, plus the curated plugin set DOWNLOADED
# from pj-plugin-registry: the same published, checksum-verified marketplace
# artifacts the Windows installer bundles. The Linux sibling of
# windows-release.yml.
#
# Architecture (2026-07 redesign, docs/plans/2026-07-16-appimage-ci-redesign.md;
# .deb addition, docs/plans/2026-08-03-debian-packaging.md):
#   * appimage job: runs INSIDE ghcr.io/plotjuggler/pj4-appimage-builder
#     (Ubuntu 22.04 / glibc 2.35 — hosted 22.04 runners retire 2027-04,
#     actions/runner-images#14254, so the floor lives in the container, not the
#     runner label). Third-party Conan binaries restore from the actions/cache
#     closure (seeded by linux-ci), with ConanCenter source builds as fallback;
#     Qt / ccache use actions/cache too.
#   * Plugins (including the multi-distro ros2-topic-subscriber bundle) are
#     resolved by packaging/appimage/build_appimage.sh --plugins-registry: every curated
#     id (BUNDLE_IDS) must resolve, download, and pass its checksum or the
#     release fails — nothing is compiled locally or skipped best-effort.
#   * The retro payload (the standalone GPLv2 pj-raster-helper, its shareware
#     data and the license texts) is compiled and staged HERE only:
#     PJ_BUILD_RASTER_HELPER is off in every other build, so no other job
#     compiles the GPL engine. Both artifacts carry it.
#   * The .deb repackages the SAME build/AppDir the AppImage was made from, so
#     it costs one relink (for the PJ_INSTALLATION=deb stamp) plus dpkg-deb.
#     Unlike the AppImage it is gated on the smoke job, which installs it in
#     clean 22.04/24.04 containers, runs it, then re-runs the same checks
#     against the AppImage — the only place either artifact is exercised on a
#     machine without build dependencies.
#   * apt-publish job: uploads that same smoke-tested .deb to the apt
#     repository on Cloudflare R2 and re-signs its metadata, so `apt upgrade`
#     reaches users who added it. Runs only for tags, only after deb-release,
#     and only where the PJ4_APT_PUBLIC_URL repo variable exists. See
#     packaging/deb/README.md, "Distribution".
#
# Triggers:
#   - workflow_dispatch          -> build from any branch (artifacts only, no Release upload)
#   - push of a version tag      -> build + attach both artifacts to that tag's Release
#     (e.g. `3.9.1` — no leading 'v')

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # softprops/action-gh-release needs write to create/update the Release
  packages: read    # pull the builder image from GHCR

concurrency:
  group: linux-appimage-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: depot-ubuntu-22.04-4
    timeout-minutes: 240
    outputs:
      deb_name: ${{ steps.package_deb.outputs.deb_name }}
      appimage_name: ${{ steps.package_appimage.outputs.appimage_name }}
    container:
      # Digest-pinned by appimage-builder-image.yml (it updates the repo
      # variable after each smoke-tested push); :latest is only the bootstrap
      # fallback for a repo where the variable does not exist yet.
      image: ${{ vars.PJ4_APPIMAGE_BUILDER_IMAGE || 'ghcr.io/plotjuggler/pj4-appimage-builder:latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Bind-mount the host's fat preinstalled-toolchain dirs so the first step
      # can empty them: a container job cannot run the usual host-side
      # `sudo rm -rf`, and the RelWithDebInfo app build needs the space
      # (linux-ci hit "ld: No space left on device" without the equivalent
      # cleanup).
      options: >-
        -v /usr/local:/host/usr/local
        -v /usr/share/dotnet:/host/dotnet
        -v /opt:/host/opt
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"   # linuxdeploy/appimagetool without FUSE
      # id Software's shareware DOOM1.WAD as shipped by Ubuntu's
      # doom-wad-shareware. Checked when it is staged and again inside the
      # finished AppImage.
      PJ_RETRO_WAD_SHA256: "1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771"
    steps:
      - name: Free host disk (from inside the container)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /host/usr/local/lib/android /host/usr/local/.ghcup \
                 /host/dotnet/* /host/opt/ghc /host/opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Use HTTPS for github.com submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read versions.env
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          echo "PJ_APP_VERSION=${PJ_APP_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_QT_VERSION=${PJ_QT_VERSION}" >> "${GITHUB_ENV}"
          echo "PJ_APPIMAGE_ARCH=${PJ_APPIMAGE_ARCH}" >> "${GITHUB_ENV}"

      - name: Resolve release version
        # Tag build -> the tag verbatim; manual dispatch -> PJ_APP_VERSION from
        # versions.env so the artifact name still carries a meaningful version.
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "PJ_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "PJ_VERSION=${PJ_APP_VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v5
        with:
          path: .qt
          # Same key as linux-ci.yml -> shared hit on the ~1 GB aqt install.
          key: qt-${{ env.PJ_QT_VERSION }}-linux-gcc_64

      - name: Install Qt via aqt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: ./scripts/install_qt6.sh

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: conan-appimage-v2-${{ hashFiles('conanfile.txt', 'conan.lock') }}
          # Prefix fallbacks: an older appimage closure first, else seed from
          # linux-ci's saved closure — same ubuntu-22.04 / gcc-11 /
          # RelWithDebInfo / cppstd=20 profile, so its packages are directly
          # reusable here (ConanCenter source builds cover any residual miss).
          restore-keys: |
            conan-appimage-
            conan-linux-gcc-relwithdebinfo-v2-

      - name: Restore ccache
        # Explicit restore/save split: the plain action's post-job save is
        # skipped when the job fails, which is exactly when preserving the
        # compiled objects matters most (failures here are usually late —
        # packaging or audit — after the full compile already happened).
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}
          # Last fallback: linux-ci's cache from main — same source tree, same
          # gcc 11.4. Sharable because both sides hash with
          # compiler_check=content, hash_dir=false, base_dir (below).
          restore-keys: |
            ccache-appimage-
            ccache-linux-build-main-

      - name: Configure ccache
        # compiler_check=content + hash_dir=false + base_dir make object hashes
        # independent of the compiler binary's mtime and of the workspace root,
        # so this container job (/__w/PJ4/PJ4) and linux-ci's runner job
        # (/home/runner/work/PJ4/PJ4) hit each other's objects. Trade-off:
        # cached objects may embed the sibling workspace path in debug info.
        shell: bash
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache -z

      - name: Seed Conan source download cache
        # minizip/1.2.13's zlib.net source URL rejects GitHub runners (HTTP
        # 415); reuse the checksum-verified repo-hosted seed like linux-ci.
        # Configured after the Conan cache restore so a restored global.conf
        # cannot clobber it.
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${RUNNER_TEMP}/conan-source-cache"
          mkdir -p "${cache_dir}/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md \
            -exec cp -f {} "${cache_dir}/s/" \;
          conan_home="$(conan config home)"
          conf="${conan_home}/global.conf"
          mkdir -p "${conan_home}"
          if [[ -f "$conf" ]]; then
            grep -vE '^core\.sources:(download_cache|download_urls)=' "$conf" > "${conf}.tmp" || true
            mv "${conf}.tmp" "$conf"
          fi
          echo "core.sources:download_cache=${cache_dir}" >> "$conf"
          # When a recipe's own host refuses a datacenter IP (sourceware.org 403s
          # for elfutils, zlib.net 415s for minizip), retry through ConanCenter's
          # sha256-addressed mirror instead of failing the build. 'origin' stays
          # FIRST deliberately: Conan aborts the whole download if a backup entry
          # answers 401/403 (only 404 falls through), so a mirror-first list would
          # put every cold build at the mercy of that one server.
          echo 'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]' >> "$conf"

      - name: Conan install (app graph)
        # Resolve/build the app dependency graph up front so it can be
        # published immediately — a later compile failure must not discard an
        # otherwise reusable closure. The ./build.sh below re-resolves the
        # same graph, which is then a fast no-op.
        id: conan_install
        shell: bash
        run: |
          set -euo pipefail
          conan profile detect --force
          scripts/configure_conan_remote.sh
          conan install . --output-folder=build --build=missing -r=plotjuggler-conan -r=conancenter \
            --lockfile=conan.lock --lockfile-partial \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20

      - name: Link pinned linuxdeploy/appimagetool into packaging/appimage/
        # build_appimage.sh uses a pre-existing packaging/appimage/<tool>.AppImage instead
        # of downloading 'continuous' — so the image-pinned bytes are what runs.
        shell: bash
        run: |
          set -euo pipefail
          for tool in linuxdeploy linuxdeploy-plugin-qt appimagetool; do
            ln -sfn "/opt/linuxdeploy/${tool}-${PJ_APPIMAGE_ARCH}.AppImage" \
                    "packaging/appimage/${tool}-${PJ_APPIMAGE_ARCH}.AppImage"
          done

      - name: Stage the retro payload's game data
        # The shareware WAD the pj-raster-helper renders is not in this repo.
        # Ubuntu multiverse's doom-wad-shareware carries id Software's freely
        # redistributable DOOM1.WAD (see 3rdparty/retro/SHAREWARE-LICENSE.txt);
        # the container already has multiverse enabled, it just has no apt
        # lists. The sha256 is pinned so a repackaged or mirror-swapped WAD
        # fails the release instead of silently changing what ships — jammy's
        # 1.9.fixed-4 and later revisions carry byte-identical data.
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends doom-wad-shareware
          wad=/usr/share/games/doom/doom1.wad
          echo "${PJ_RETRO_WAD_SHA256}  ${wad}" | sha256sum -c -
          echo "PJ_RETRO_WAD=${wad}" >> "$GITHUB_ENV"

      - name: Build app and package the AppImage (registry plugins)
        # The app compiles in the jammy container (glibc 2.35 floor); the
        # curated plugin set is downloaded from pj-plugin-registry and
        # checksum-verified by build_appimage.sh --plugins-registry.
        # Tests and demos never ship and no release flow runs ctest; skipping
        # them drops ~271 uncacheable test links and ~17 GB of build tree.
        # PJ_BUILD_RASTER_HELPER is the release's opt-in to the standalone
        # GPLv2 helper (off everywhere else, incl. linux-ci); --retro-wad then
        # stages it, its data and its licenses into the AppDir.
        id: package_appimage
        env:
          PJ_BUILD_TESTS: "OFF"
          PJ_BUILD_DEMOS: "OFF"
          PJ_BUILD_RASTER_HELPER: "ON"
          PJ_INSTALLATION: "appimage"
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          # --commit-hash only on non-tag (manual) builds: PJ_VERSION is already
          # the unique identifier for a tag release, matching the Windows
          # installer's -CleanReleaseName; dispatch builds need the hash so
          # otherwise-identical-looking artifacts stay distinguishable.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            bash packaging/appimage/build_appimage.sh --plugins-registry --retro-wad "${PJ_RETRO_WAD}"
          else
            bash packaging/appimage/build_appimage.sh --plugins-registry --retro-wad "${PJ_RETRO_WAD}" \
                                            --commit-hash "${GITHUB_SHA:0:8}"
          fi
          appimage_path="$(ls -1 packaging/appimage/PlotJuggler-*.AppImage | head -n 1)"
          if [[ -z "$appimage_path" ]]; then
            echo "::error::AppImage not produced under packaging/appimage/" >&2
            exit 1
          fi
          echo "APPIMAGE=$appimage_path" >> "$GITHUB_ENV"
          echo "APPIMAGE_NAME=$(basename "$appimage_path")" >> "$GITHUB_ENV"
          echo "appimage_name=$(basename "$appimage_path")" >> "$GITHUB_OUTPUT"

      - name: Self-test the packaged Python backend
        # The only step in any release flow that RUNS the AppImage. Everything else
        # inspects it statically, which is why a Python backend that could not import
        # its own stdlib shipped unnoticed. Covers the whole packaging contract at
        # once: the bundled libpython resolves, PYTHONHOME points at the bundled
        # stdlib, lib-dynload made it into the AppDir, and the import allowlist holds.
        # No display or QT_QPA_PLATFORM needed: --selftest-python is handled
        # before QApplication exists (see pj_app/src/main.cpp).
        shell: bash
        run: '"${APPIMAGE}" --selftest-python'

      - name: Verify the retro payload shipped
        # The payload is opt-in at three independent points (the CMake option,
        # the WAD staging, --retro-wad), so assert on the finished artifact
        # instead of trusting that all three lined up. Extracting again rather
        # than reusing the audit's tree keeps peak disk at one extraction.
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cp "${APPIMAGE}" "${workdir}/app.AppImage"
          ( cd "${workdir}" && ./app.AppImage --appimage-extract >/dev/null )
          retro="${workdir}/squashfs-root/usr/bin/3rdparty/retro"
          # The three license texts are a condition of shipping the other two
          # files at all, so their absence fails the release like a missing binary.
          for f in pj-raster-helper base.wad COPYING SOURCE-OFFER.txt SHAREWARE-LICENSE.txt README.md; do
            [[ -f "${retro}/${f}" ]] || { echo "::error::retro payload is missing ${f}"; exit 1; }
          done
          [[ -x "${retro}/pj-raster-helper" ]] || { echo "::error::pj-raster-helper is not executable"; exit 1; }
          echo "${PJ_RETRO_WAD_SHA256}  ${retro}/base.wad" | sha256sum -c -
          echo "retro payload OK"

      - name: Trim Conan cache before saving
        if: always() && github.ref_type != 'tag' && steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: conan cache clean "*" --build --source --temp || true

      - name: Save Conan cache
        # always(): a failed app compile must still persist the expensive
        # third-party closure. Runs after logout (no credentials in the cache).
        if: always() && github.ref_type != 'tag' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          key: conan-appimage-v2-${{ hashFiles('conanfile.txt', 'conan.lock') }}

      - name: Save ccache
        # always(): keep the objects even when a late step fails.
        #
        # Re-seed only when the restore found nothing at all. The key carries
        # the SHA (cache keys are immutable), so saving whenever the exact key
        # missed wrote a new ~2 GB blob per dispatch into per-GB-month billed
        # Depot Cache storage. The restore-keys above fall back to CI's
        # ccache-linux-build-main-, which every push to main refreshes, and
        # hash_dir=false + base_dir make those objects valid here — so the warm
        # path survives without this workflow keeping its own generation.
        if: always() && github.ref_type != 'tag' && steps.ccache-restore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ccache
          key: ccache-appimage-${{ github.sha }}

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s || true

      - name: Audit AppImage glibc floor
        # The whole point of the container: nothing bundled may require a glibc
        # newer than 2.35. Extract and scan every ELF's versioned GLIBC_ needs.
        # Exempt the ROS 2 per-distro INNER binaries (ros2-topic-subscriber/
        # dist/<distro>/): they are deliberately built in each distro's own
        # container (jazzy/rolling -> Ubuntu 24.04 / glibc 2.38) and are only
        # dlopen'ed on machines that run that distro. The proxy .so the app
        # loads directly sits OUTSIDE dist/ and stays subject to the audit.
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp "${APPIMAGE}" "${workdir}/app.AppImage"
          cd "${workdir}"
          ./app.AppImage --appimage-extract >/dev/null
          bad_found=""
          while IFS= read -r -d '' f; do
            case "$f" in
              */plugins/ros2-topic-subscriber/dist/*) continue ;;
            esac
            if file -b "$f" | grep -q ELF; then
              # readelf -V prints the version-needs section (.gnu.version_r) —
              # the actual GLIBC versions the loader will demand, unlike a raw
              # strings scan which also matches incidental mentions.
              bad="$(readelf -V "$f" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | awk -F. '$2 > 35' || true)"
              if [[ -n "$bad" ]]; then
                echo "::error::${f#squashfs-root/} requires ${bad//$'\n'/, } (> GLIBC_2.35)"
                bad_found=1
              fi
            fi
          done < <(find squashfs-root -type f \( -name '*.so*' -o -perm -u+x \) -print0)
          if [[ -n "$bad_found" ]]; then
            exit 1
          fi
          echo "glibc floor OK: no bundled ELF requires > GLIBC_2.35"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPIMAGE_NAME }}
          path: ${{ env.APPIMAGE }}
          if-no-files-found: error

      - name: Attach AppImage to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      # --- Debian package -----------------------------------------------
      # Runs after the AppImage is published so a .deb failure can never cost
      # the AppImage its release upload.

      - name: Restamp the app for the deb channel
        # PJ_INSTALLATION is a compile-time stamp, so the telemetry ping can only
        # report 'deb' from a rebuild. It is one translation unit: pj_version.h is
        # included by main.cpp alone, so this is a recompile plus a link, and
        # build.sh reuses the existing build dir (build/AppDir survives).
        env:
          PJ_BUILD_TESTS: "OFF"
          PJ_BUILD_DEMOS: "OFF"
          # Kept ON so the reconfigure does not drop the helper target from the
          # build tree; the .deb's own copy comes from the AppDir either way.
          PJ_BUILD_RASTER_HELPER: "ON"
          PJ_INSTALLATION: "deb"
        shell: bash
        run: ./build.sh

      - name: Package the .deb
        # Repackages build/AppDir — already deployed, plugin-bundled and
        # glibc-audited above — swapping in the freshly stamped binary.
        id: package_deb
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            bash packaging/deb/build_deb.sh --binary build/pj_app/plotjuggler4
          else
            bash packaging/deb/build_deb.sh --binary build/pj_app/plotjuggler4 \
                                  --commit-hash "${GITHUB_SHA:0:8}"
          fi
          deb_path="$(ls -1 packaging/deb/plotjuggler4_*.deb | head -n 1)"
          if [[ -z "$deb_path" ]]; then
            echo "::error::no .deb produced under packaging/deb/" >&2
            exit 1
          fi
          echo "DEB=$deb_path" >> "$GITHUB_ENV"
          echo "deb_name=$(basename "$deb_path")" >> "$GITHUB_OUTPUT"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_deb.outputs.deb_name }}
          path: ${{ env.DEB }}
          if-no-files-found: error

  smoke:
    # Install the .deb on bare distro images and RUN it, then run the AppImage
    # in the same container. `apt install` succeeding only proves the declared
    # Depends resolve; a too-new glibc or libstdc++ version symbol is burned
    # into the ELF and no package name expresses it, so only executing the
    # binaries catches that. packaging/deb/smoke_test.sh proves the linkable closure
    # with an ldd gate run BEFORE Xvfb is installed (Xvfb's own X11 libraries
    # would otherwise mask a missing GUI dependency); the GUI phases cover the
    # dlopen'd remainder. One container per image, deliberately: the AppImage
    # phase inherits exactly the libraries the .deb's Depends pulled in.
    # Docker rather than a job-level `container:` so the actions run on the
    # host runner and the images stay untouched by the Actions runtime.
    #
    # The AppImage is already attached to the Release before this job runs
    # (deliberate ordering — a smoke failure must not cost it the upload);
    # only the .deb attach is gated here.
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Download the .deb
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.appimage.outputs.deb_name }}
          path: pkg

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.appimage.outputs.appimage_name }}
          path: appimg

      - name: Install and run in a clean ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}/pkg:/pkg:ro" \
            -v "${PWD}/appimg:/appimg:ro" \
            -v "${PWD}/packaging:/packaging:ro" \
            "${{ matrix.image }}" \
            sh -c 'set -e; sh /packaging/deb/smoke_test.sh; sh /packaging/appimage/smoke_test.sh /appimg/*.AppImage'

  deb-release:
    # Gated on smoke: unlike the AppImage, the .deb is only attached to the
    # Release once it has been proven to install and run on a clean machine.
    needs: [appimage, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the .deb
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.appimage.outputs.deb_name }}
          path: pkg

      - name: Attach .deb to the GitHub Release
        # No generate_release_notes here: the appimage job already produced the
        # notes for this tag, and regenerating would rewrite the release body.
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/${{ needs.appimage.outputs.deb_name }}
          fail_on_unmatched_files: true

  apt-publish:
    # Push the released .deb into the apt repository on Cloudflare R2 and
    # re-sign the metadata around it, so machines that added the repository
    # pick the new version up with `apt upgrade`.
    #
    # Gated on deb-release rather than just smoke: the GitHub Release asset is
    # the canonical artifact, so it lands first — the same ordering rule that
    # publishes the AppImage before the .deb is packaged.
    #
    # Skipped entirely unless PJ4_APT_PUBLIC_URL is set (the `secrets` context
    # is not available in a job-level `if`, so the repo variable is what gates
    # it). A fork, or this repo before the bucket exists, therefore releases
    # exactly as it did before.
    needs: [appimage, smoke, deb-release]
    if: startsWith(github.ref, 'refs/tags/') && vars.PJ4_APT_PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Download the .deb
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.appimage.outputs.deb_name }}
          path: pkg

      - name: Install apt-ftparchive
        # The AWS CLI is preinstalled on the runner image; apt-ftparchive
        # (apt-utils) is the one tool the publisher needs that is not.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils

      - name: Publish to the apt repository
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          PJ_APT_PUBLIC_URL: ${{ vars.PJ4_APT_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/deb/publish_apt.sh "pkg/${{ needs.appimage.outputs.deb_name }}"
